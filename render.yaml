databases:
  - name: webexcels-drm-db
    plan: free

services:
  - type: web
    name: webexcels-drm
    env: node
    plan: free
    buildCommand: npm ci && npm run db:setup && npm run build
    startCommand: NODE_ENV=production node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: webexcels-drm-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: SKIP_PRESTART_BUILD
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@webexcels.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Add your secrets in Render dashboard or an env group and reference here.
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: OPENAI_BASE_URL
      #   sync: false
    healthCheckPath: /
