# ============================================================
# WebExcels DRM — GCP Cloud Build Configuration
# ============================================================
# Builds Docker image, pushes to Artifact Registry, and deploys
# to Cloud Run.
#
# Prerequisites (one-time setup):
#   1. Enable APIs: Cloud Build, Cloud Run, Artifact Registry
#   2. Create Artifact Registry Docker repo:
#      gcloud artifacts repositories create webexcels-drm \
#        --repository-format=docker \
#        --location=us-central1
#   3. Set secrets in GCP Secret Manager:
#      - DATABASE_URL
#      - JWT_SECRET
# ============================================================

substitutions:
  _REGION: "us-central1"
  _REPO: "webexcels-drm"
  _SERVICE: "webexcels-drm"
  _IMAGE: "us-central1-docker.pkg.dev/${PROJECT_ID}/webexcels-drm/app"

steps:
  # ── Step 1: Build the Docker image ──────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-t"
      - "${_IMAGE}:${SHORT_SHA}"
      - "-t"
      - "${_IMAGE}:latest"
      - "--cache-from"
      - "${_IMAGE}:latest"
      - "."

  # ── Step 2: Push the image to Artifact Registry ─────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - "push"
      - "--all-tags"
      - "${_IMAGE}"
    waitFor:
      - "build"

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_IMAGE}:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "8080"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "NODE_ENV=production,DATABASE_SSL=true"
      - "--set-secrets"
      - "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest"
    waitFor:
      - "push"

# Push the built images to Artifact Registry
images:
  - "${_IMAGE}:${SHORT_SHA}"
  - "${_IMAGE}:latest"

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

# Build timeout (10 minutes)
timeout: "600s"
